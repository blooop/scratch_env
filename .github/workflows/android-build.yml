name: Android CI - Build APK

on:
  push:
    branches: [ claude/android-calendar-year-view-Ckk5P ]
    paths:
      - 'YearCalendar/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'YearCalendar/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: YearCalendar

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Create local.properties with OAuth credentials
      run: |
        echo "google.client.id=${{ secrets.GOOGLE_CLIENT_ID }}" > local.properties
        echo "google.client.secret=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> local.properties
        echo "google.project.id=${{ secrets.GOOGLE_PROJECT_ID }}" >> local.properties

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: year-calendar-debug-apk
        path: YearCalendar/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: Build Release APK (unsigned)
      run: ./gradlew assembleRelease --stacktrace
      continue-on-error: true

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: year-calendar-release-apk
        path: YearCalendar/app/build/outputs/apk/release/app-release-unsigned.apk
        retention-days: 30

    - name: Display APK info
      if: success()
      run: |
        echo "✅ APK build successful!"
        echo "📦 Debug APK: YearCalendar/app/build/outputs/apk/debug/app-debug.apk"
        ls -lh app/build/outputs/apk/debug/ || true
