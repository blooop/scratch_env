[project]
name = "ros2_pixi_workspace"
version = "0.1.0"
authors = [{ name = "Austin Gregg-Smith", email = "blooop@gmail.com" }]
description = "A pixi-based ROS2 workspace with devcontainer support"
readme = "README.md"
license = "MIT"

dependencies = []

[project.urls]
Source = "https://github.com/blooop/scratch_env"
Home = "https://github.com/blooop/scratch_env"

[tool.pixi.workspace]
channels = ["robostack-staging", "conda-forge"]
platforms = ["linux-64"]
preview = ["pixi-build"]

[tool.pixi.dependencies]
python = "3.11.*"
ros-humble-ros-base = "*"
ros-humble-ament-cmake = "*"
ros-humble-ament-cmake-python = "*"
colcon-common-extensions = "*"
ros-humble-rosidl-default-generators = "*"
ros-humble-rosidl-default-runtime = "*"
vcstool = "*"
compilers = "*"
cmake = "*"
ninja = "*"
pkg-config = "*"
setuptools = "<=58.2.0"
# Dev tools
fzf = "*"
fd-find = "*"
ripgrep = "*"
vim = "*"
git = "*"
curl = "*"
wget = "*"

[tool.pixi.pypi-dependencies]
colcon-runner = "*"
pytest = "*"
pytest-cov = "*"
ruff = "*"
pylint = "*"
coverage = "*"
pyyaml = "*"

[project.optional-dependencies]
test = [
  "pylint>=3.2.5,<=3.3.4",
  "pytest-cov>=4.1,<=6.0.0",
  "pytest>=7.4,<=8.3.4",
  "hypothesis>=6.104.2,<=6.124.9",
  "ruff>=0.5.0,<=0.9.4",
  "coverage>=7.5.4,<=7.6.10",
  "pre-commit<=4.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["python_template"]

# Activation scripts
[tool.pixi.activation]
scripts = ["activation.sh"]

# Environments
[tool.pixi.environments]
default = { solve-group = "default" }


[tool.pixi.tasks]
# ROS2 Build Tasks
clean = "rm -rf build install log"
import-repos = "vcs import src < repos.repos"
install-deps = "rosdep install --from-paths src --ignore-src -r -y"
build = "colcon build --symlink-install"
build-cr = "cr b"
source-setup = "source install/setup.bash"

# ROS2 Testing Tasks
test-workspace = "pytest test/workspace -v"
test-colcon = "colcon test"
test-cr = "cr t"
test-results = "colcon test-result --verbose"
test = { depends-on = ["test-workspace", "test-colcon", "test-results"] }

# ROS2 Linting Tasks
lint-python = "ruff check src --fix"
lint-python-format = "ruff format src"
lint-cpp = "find src -name '*.cpp' -o -name '*.hpp' | xargs -r clang-format -i || true"
ament-lint = "ament_cpplint src || true"
lint = { depends-on = ["lint-python-format", "lint-python", "lint-cpp"] }

# Setup Task
setup = { depends-on = ["import-repos", "install-deps"] }

# Combined CI Task
ci = { depends-on = ["clean", "build", "lint", "test"] }
ci-full = { depends-on = ["clean", "setup", "build", "lint", "test"] }

# Utility Tasks
update-lock = "pixi update && git commit -a -m'update pixi.lock' || true"
clear-pixi = "rm -rf .pixi pixi.lock"
setup-git-merge-driver = "git config merge.ourslock.driver true"

[tool.pylint]
extension-pkg-whitelist = ["numpy"]
jobs = 16                           #detect number of cores

[tool.pylint.'MESSAGES CONTROL']
disable = "C,logging-fstring-interpolation,line-too-long,fixme,broad-exception-caught,missing-module-docstring,too-many-instance-attributes,too-few-public-methods,too-many-arguments,too-many-locals,too-many-branches,too-many-statements,use-dict-literal,cyclic-import,duplicate-code,too-many-public-methods"
enable = "no-else-return,consider-using-in"

[tool.coverage.run]
omit = ["*/test/*", "__init__.py"]

[tool.coverage.report]
exclude_also = [
  "def __repr__",
  "if False:",
  "if 0:",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "pass",
  "(_):",
]
